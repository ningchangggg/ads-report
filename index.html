<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>中文日曆 廣告日報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f5f6f8;--paper:#fff;--ink:#18212e;--ink2:#5a6577;--line:#dde2ea;--accent:#1f5f8b;--good:#1f8a57;--mid:#b7791f;--bad:#c53b3b}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--paper:#161d27;--ink:#e7ecf2;--ink2:#a3aebd;--line:#2a3443;--accent:#6fb0dc;--good:#4cc38a;--mid:#e0a64a;--bad:#ef6d6d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;padding:28px 16px 60px}
.w{max-width:720px;margin:0 auto}.eb{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--accent)}
h1{font-size:28px;font-weight:900;margin:6px 0 4px}p{color:var(--ink2);font-size:13px;margin:0 0 20px}
.day{display:grid;grid-template-columns:64px 1fr 1fr 1fr 18px;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:inherit;text-decoration:none}
.day:hover,.day:focus-visible{border-color:var(--accent)}
.dd b{display:block;font-size:18px}.dd span{font-size:11px;color:var(--ink2)}
.m{font:500 14px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}.m span{display:block;font:11px "Noto Sans TC",sans-serif;color:var(--ink2)}
.m i{font-style:normal}.good{color:var(--good)}.mid{color:var(--mid)}.bad{color:var(--bad)}.go{color:var(--accent)}
@media (max-width:420px){.day{grid-template-columns:52px 1.2fr .8fr .6fr 12px;padding:10px}.m{font-size:13px}}
</style></head><body><div class="w"><div class="eb">META ADS · 中文日曆</div><h1>每日受眾／素材分析</h1>
